<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>BlinkView</title>
<style>
:root{--green:#00c880;--green2:#25e6a0;--dim:#91a3a1;--red:#ff7b6e;--line:rgba(255,255,255,.12)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;overflow:hidden;background:#05080d;color:#eef4f2;font:13px/1.35 "Segoe UI Variable","Segoe UI",system-ui,sans-serif}
#stage{position:fixed;inset:0;display:grid;place-items:center;background:#05080d}
video{width:100%;height:100%;object-fit:contain;display:block;background:#05080d}
#load{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;background:rgba(3,8,13,.72);transition:opacity .25s;z-index:2}
#load.hide{opacity:0;pointer-events:none}
.spin{width:32px;height:32px;border-radius:50%;border:2px solid rgba(255,255,255,.16);border-top-color:var(--green2);animation:spin .9s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
#load b{display:block;font-size:15px;font-weight:600;margin-bottom:6px}
#msg{color:var(--dim);font-size:12.5px;max-width:330px}
#msg.bad{color:var(--red)}
#hud{position:absolute;left:0;right:0;bottom:0;z-index:3;display:flex;align-items:center;gap:7px;padding:10px;background:linear-gradient(0deg,rgba(0,0,0,.82),rgba(0,0,0,.35) 65%,transparent);opacity:.92;transition:opacity .2s}
#hud:hover{opacity:1}
#name{flex:1;min-width:0;font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 6px #000}
button{height:34px;padding:0 12px;border-radius:11px;border:1px solid var(--line);background:rgba(255,255,255,.08);color:#fff;font:inherit;cursor:pointer;white-space:nowrap;transition:background .2s,transform .15s}
button:hover{background:rgba(255,255,255,.15)}
button:active{transform:scale(.96)}
button.pri{background:linear-gradient(180deg,var(--green2),#00a871);border:0;color:#042019;font-weight:600}
button:disabled{opacity:.4;cursor:default}
body.idle #hud{opacity:0}
body.idle:hover #hud{opacity:1}
</style>
</head>
<body>
<div id="stage">
  <video id="v" autoplay playsinline controls muted></video>
  <div id="load"><div><div class="spin"></div><b id="title">Blink camera</b><span id="msg">Starting live view…</span></div></div>
  <div id="hud">
    <span id="name">Camera</span>
    <button id="mute" title="Toggle sound">Sound off</button>
    <button id="pip" class="pri" disabled>Picture in picture</button>
    <button id="retry" title="Reconnect">Reconnect</button>
  </div>
</div>
<script>
const $ = s => document.querySelector(s)
const v = $('#v'), load = $('#load'), msg = $('#msg'), title = $('#title'), nameEl = $('#name')
const pipBtn = $('#pip'), muteBtn = $('#mute'), retryBtn = $('#retry')
const cam = new URLSearchParams(location.search).get('cam')
let gen = 0

async function api(path, opt = {}) {
  const r = await fetch(path, { cache: 'no-store', ...opt })
  if (!r.ok) {
    let m = r.statusText || `HTTP ${r.status}`
    try { const j = await r.json(); m = j.detail || j.title || m } catch {}
    throw new Error(m)
  }
  if (r.status === 204) return null
  return (r.headers.get('content-type') || '').includes('json') ? r.json() : r.text()
}

function watchOf(st, id) {
  const w = ((st && st.watches) || []).find(x => x.id === id)
  if (w) return w
  return st && st.watchId === id ? { id, live: !!st.watchLive, note: st.watchNote } : null
}

function show(text, bad) {
  msg.textContent = text
  msg.classList.toggle('bad', !!bad)
  load.classList.remove('hide')
}

function hide() {
  load.classList.add('hide')
  msg.classList.remove('bad')
}

function fail(text) {
  pipBtn.disabled = true
  show(text || 'Live view could not start.', true)
}

function attach(id) {
  const g = gen
  v.addEventListener('playing', () => { if (g === gen) hide() }, { once: false })
  v.addEventListener('loadeddata', () => { if (g === gen) hide() }, { once: false })
  v.addEventListener('waiting', () => { if (g === gen) show('Buffering…') })
  v.addEventListener('error', () => { if (g === gen) fail('Live view stopped. Use Reconnect.') })
  v.addEventListener('ended', () => { if (g === gen) fail('Live view stopped. Use Reconnect.') })
  v.src = `/api/cameras/${encodeURIComponent(id)}/live.mp4?t=${Date.now()}`
  v.muted = true
  muteBtn.textContent = 'Sound off'
  pipBtn.disabled = false
  v.play().then(hide).catch(() => { show('Press play on the video to start.'); hide() })
  setTimeout(() => { if (g === gen && v.readyState >= 2) hide() }, 1500)
}

async function start() {
  const g = ++gen
  pipBtn.disabled = true
  v.pause()
  try { v.removeAttribute('src'); v.load() } catch {}
  if (!cam) { fail('No camera was selected.'); return }
  title.textContent = 'Blink camera'
  show('Starting live view…')
  try {
    let st = await api('/api/state')
    if (!st.loggedIn) { fail('Sign in from the BlinkView tray app first.'); return }
    const c = (st.cameras || []).find(x => x.id === cam)
    if (!c) { fail('Camera not found.'); return }
    if (!c.online) { fail('This camera is offline.'); return }
    title.textContent = c.name
    nameEl.textContent = c.name
    document.title = c.name + ' — BlinkView'
    let w = watchOf(st, cam)
    if (!w || !w.live) {
      await api(`/api/cameras/${encodeURIComponent(cam)}/wake`, { method: 'POST' })
    }
    let seen = false
    for (let i = 0; i < 120; i++) {
      if (g !== gen) return
      st = await api('/api/state')
      w = watchOf(st, cam)
      if (w && w.live) seen = true
      if (seen && (!w || !w.live)) { fail('Live view stopped before it started.'); return }
      if (w && w.live && !w.note) { attach(cam); return }
      if (w && String(w.note || '').startsWith('Error:')) {
        fail(String(w.note).replace(/^Error:\s*/, ''))
        return
      }
      if (i === 40) show('Still waking the camera…')
      await new Promise(r => setTimeout(r, 500))
    }
    fail('Live view took too long. Use Reconnect.')
  } catch (e) {
    if (g === gen) fail(e.message)
  }
}

pipBtn.addEventListener('click', async () => {
  try {
    if (document.pictureInPictureElement) await document.exitPictureInPicture()
    else await v.requestPictureInPicture()
  } catch (e) { msg.classList.add('bad'); msg.textContent = e.message || 'Picture-in-picture failed.' }
})

muteBtn.addEventListener('click', () => {
  v.muted = !v.muted
  muteBtn.textContent = v.muted ? 'Sound off' : 'Sound on'
})

retryBtn.addEventListener('click', start)
v.addEventListener('click', () => {
  if (v.paused) v.play().catch(() => {})
})

let idle
function wakeHUD() {
  document.body.classList.remove('idle')
  clearTimeout(idle)
  idle = setTimeout(() => { if (!v.paused) document.body.classList.add('idle') }, 2600)
}
document.addEventListener('mousemove', wakeHUD)
document.addEventListener('touchstart', wakeHUD)
wakeHUD()
start()
</script>
</body>
</html>
